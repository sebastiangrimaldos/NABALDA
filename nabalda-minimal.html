<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nabalda</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@200;300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --dark: #1A2620;
    --mid: #2C3028;
    --musgo: #7A8C5E;
    --agua: #5C8B7A;
    --paja: #B5A882;
    --niebla: #D4C5A0;
    --laguna: #F5F2EA;
    --flor: #E8C87A;
  }

  html, body {
    height: 100%;
    background: var(--dark);
    color: var(--laguna);
    font-family: 'Jost', sans-serif;
    font-weight: 200;
    overflow: hidden;
  }

  /* MIST */
  .mist {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .mist-layer {
    position: absolute;
    width: 200%;
    height: 100%;
    animation: drift ease-in-out infinite;
  }
  .m1 {
    background: radial-gradient(ellipse 60% 40% at 70% 40%, rgba(92,139,122,0.05) 0%, transparent 70%);
    animation-duration: 22s;
  }
  .m2 {
    background: radial-gradient(ellipse 50% 50% at 30% 60%, rgba(122,140,94,0.04) 0%, transparent 60%);
    animation-duration: 30s;
    animation-delay: -10s;
  }
  .m3 {
    background: radial-gradient(ellipse 40% 30% at 60% 70%, rgba(212,197,160,0.025) 0%, transparent 50%);
    animation-duration: 18s;
    animation-delay: -5s;
  }
  @keyframes drift {
    0%, 100% { transform: translateX(-20%) translateY(0); }
    50% { transform: translateX(0%) translateY(-2%); }
  }

  /* FRAILEJONES */
  .frailejones {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 38%;
    opacity: 0.055;
    pointer-events: none;
    z-index: 0;
  }

  /* LAYOUT */
  .page {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: grid;
    grid-template-rows: 1fr auto;
    padding: 0 5vw;
  }

  /* CENTER */
  .center {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-top: 6vh;
  }

  .eyebrow {
    font-size: 9px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--musgo);
    margin-bottom: 2.5rem;
    opacity: 0;
    animation: up 1.2s 0.2s cubic-bezier(.16,1,.3,1) forwards;
  }

  .wordmark {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(64px, 12vw, 160px);
    line-height: 0.88;
    letter-spacing: 0.08em;
    color: var(--laguna);
    margin-bottom: 3rem;
    opacity: 0;
    animation: up 1.4s 0.4s cubic-bezier(.16,1,.3,1) forwards;
  }

  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(16px, 2.2vw, 26px);
    color: var(--paja);
    letter-spacing: 0.04em;
    line-height: 1.5;
    max-width: 520px;
    opacity: 0;
    animation: up 1.4s 0.7s cubic-bezier(.16,1,.3,1) forwards;
  }

  .rule {
    width: 48px;
    height: 0.5px;
    background: var(--musgo);
    margin: 2.5rem 0;
    opacity: 0;
    animation: up 1.2s 0.9s cubic-bezier(.16,1,.3,1) forwards;
  }

  .sub {
    font-size: 10px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--musgo);
    opacity: 0;
    animation: up 1.2s 1.1s cubic-bezier(.16,1,.3,1) forwards;
  }

  /* BOTTOM BAR */
  .bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 2.5rem 0 3rem;
    border-top: 0.5px solid rgba(122,140,94,0.2);
    opacity: 0;
    animation: fade 1.5s 1.4s forwards;
  }

  .bar-left {
    font-size: 9px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(122,140,94,0.6);
    line-height: 2;
  }

  .bar-contact {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }

  .contact-label {
    font-size: 8px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(122,140,94,0.5);
  }

  .contact-email {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: 15px;
    letter-spacing: 0.08em;
    color: var(--paja);
    text-decoration: none;
    transition: color 0.3s;
  }
  .contact-email:hover { color: var(--flor); }

  @keyframes up {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
</style>
</head>
<body>

<!-- mist -->
<div class="mist">
  <div class="mist-layer m1"></div>
  <div class="mist-layer m2"></div>
  <div class="mist-layer m3"></div>
</div>

<!-- frailejones -->

  <g fill="#7A8C5E">
    <ellipse cx="60"   cy="310" rx="13" ry="48"/><ellipse cx="60"   cy="262" rx="26" ry="14"/>
    <ellipse cx="160"  cy="320" rx="10" ry="38"/><ellipse cx="160"  cy="282" rx="20" ry="11"/>
    <ellipse cx="260"  cy="308" rx="15" ry="55"/><ellipse cx="260"  cy="253" rx="30" ry="16"/>
    <ellipse cx="360"  cy="318" rx="11" ry="42"/><ellipse cx="360"  cy="276" rx="22" ry="12"/>
    <ellipse cx="460"  cy="306" rx="16" ry="58"/><ellipse cx="460"  cy="248" rx="32" ry="17"/>
    <ellipse cx="560"  cy="315" rx="12" ry="44"/><ellipse cx="560"  cy="271" rx="24" ry="13"/>
    <ellipse cx="660"  cy="310" rx="14" ry="52"/><ellipse cx="660"  cy="258" rx="28" ry="15"/>
    <ellipse cx="760"  cy="320" rx="10" ry="38"/><ellipse cx="760"  cy="282" rx="20" ry="11"/>
    <ellipse cx="860"  cy="307" rx="16" ry="57"/><ellipse cx="860"  cy="250" rx="32" ry="17"/>
    <ellipse cx="960"  cy="316" rx="11" ry="43"/><ellipse cx="960"  cy="273" rx="22" ry="12"/>
    <ellipse cx="1060" cy="309" rx="15" ry="53"/><ellipse cx="1060" cy="256" rx="30" ry="16"/>
    <ellipse cx="1160" cy="318" rx="12" ry="41"/><ellipse cx="1160" cy="277" rx="24" ry="13"/>
    <ellipse cx="1260" cy="306" rx="16" ry="58"/><ellipse cx="1260" cy="248" rx="33" ry="18"/>
    <ellipse cx="1380" cy="313" rx="13" ry="47"/><ellipse cx="1380" cy="266" rx="26" ry="14"/>
  </g>
</svg>

<div class="page">
  <div class="center">
    <p class="eyebrow">Toronto · Creative Industries Fund · Pre-Seed</p>
    <h1 class="wordmark">Nabalda</h1>
    <p class="tagline">We help creators<br>build thriving worlds.</p>
    <div class="rule"></div>
    <p class="sub">Creativity · Intergenerational Value · Technology</p>
  </div>

  <div class="bar">
    <div class="bar-left">
      nabalda.com<br>
      © 2026 Nabalda
    </div>
    <div class="bar-contact">
      <span class="contact-label">Contact</span>
      <a href="mailto:info@nabalda.com" class="contact-email">info@nabalda.com</a>
    </div>
  </div>
</div>

</body>
</html>
