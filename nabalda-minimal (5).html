<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --dark: #1A2620;
    --musgo: #7A8C5E;
    --paja: #B5A882;
    --laguna: #F5F2EA;
    --flor: #E8C87A;
  }

  html, body {
    height: 100%;
    background: var(--dark);
    color: var(--laguna);
    font-family: 'Jost', sans-serif;
    font-weight: 200;
  }

  /* MIST */
  .mist {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .mist-layer {
    position: absolute;
    width: 200%;
    height: 100%;
    animation: drift ease-in-out infinite;
  }
  .m1 {
    background: radial-gradient(ellipse 60% 40% at 70% 40%, rgba(92,139,122,0.05) 0%, transparent 70%);
    animation-duration: 22s;
  }
  .m2 {
    background: radial-gradient(ellipse 50% 50% at 30% 60%, rgba(122,140,94,0.04) 0%, transparent 60%);
    animation-duration: 30s;
    animation-delay: -10s;
  }
  .m3 {
    background: radial-gradient(ellipse 40% 30% at 60% 70%, rgba(212,197,160,0.025) 0%, transparent 50%);
    animation-duration: 18s;
    animation-delay: -5s;
  }
  @keyframes drift {
    0%, 100% { transform: translateX(-20%) translateY(0); }
    50% { transform: translateX(0%) translateY(-2%); }
  }

  /* FRAILEJONES */
  .frailejones {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 38%;
    opacity: 0.055;
    pointer-events: none;
    z-index: 0;
  }

  /* LAYOUT */
  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: grid;
    grid-template-rows: 1fr auto;
    padding: 0 6vw;
  }

  /* CENTER */
  .center {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-top: 8vh;
    padding-bottom: 4vh;
  }

  .eyebrow {
    font-size: clamp(11px, 2vw, 13px);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--niebla);
    margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
    opacity: 0;
    animation: up 1.2s 0.2s cubic-bezier(.16,1,.3,1) forwards;
  }

  .wordmark {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(52px, 14vw, 160px);
    line-height: 0.88;
    letter-spacing: 0.08em;
    color: var(--laguna);
    margin-bottom: clamp(1.5rem, 4vw, 3rem);
    opacity: 0;
    animation: up 1.4s 0.4s cubic-bezier(.16,1,.3,1) forwards;
  }

  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(18px, 3.5vw, 26px);
    color: var(--paja);
    letter-spacing: 0.04em;
    line-height: 1.5;
    max-width: 520px;
    opacity: 0;
    animation: up 1.4s 0.7s cubic-bezier(.16,1,.3,1) forwards;
  }

  .rule {
    width: 48px;
    height: 0.5px;
    background: var(--musgo);
    margin: clamp(1.5rem, 4vw, 2.5rem) 0;
    opacity: 0;
    animation: up 1.2s 0.9s cubic-bezier(.16,1,.3,1) forwards;
  }

  .sub {
    font-size: clamp(13px, 1.8vw, 13px);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--niebla);
    opacity: 0;
    animation: up 1.2s 1.1s cubic-bezier(.16,1,.3,1) forwards;
    line-height: 2.2;
  }

  /* BOTTOM BAR */
  .bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 2rem 0 clamp(2rem, 5vw, 3rem);
    border-top: 0.5px solid rgba(122,140,94,0.2);
    opacity: 0;
    animation: fade 1.5s 1.4s forwards;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .bar-left {
    font-size: clamp(11px, 1.8vw, 12px);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(122,140,94,0.6);
    line-height: 2;
  }

  .bar-contact {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }

  .contact-label {
    font-size: clamp(10px, 1.6vw, 11px);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(122,140,94,0.5);
  }

  .contact-email {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(18px, 3vw, 22px);
    letter-spacing: 0.05em;
    color: var(--paja);
    text-decoration: none;
    transition: color 0.3s;
  }
  .contact-email:hover { color: var(--flor); }

  @keyframes up {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* MOBILE */
  @media (max-width: 480px) {
    .page { padding: 0 8vw; }
    .sub { letter-spacing: 0.2em; }
    .bar { flex-direction: column; align-items: flex-start; gap: 1.2rem; }
    .bar-contact { align-items: flex-start; }
    .contact-email { font-size: 20px; }
  }

  /* LANDSCAPE MOBILE */
  @media (max-height: 500px) and (orientation: landscape) {
    .center { padding-top: 4vh; padding-bottom: 2vh; }
    .wordmark { font-size: clamp(36px, 10vw, 80px); margin-bottom: 1rem; }
    .eyebrow { margin-bottom: 1rem; }
    .rule { margin: 1rem 0; }
    .tagline { font-size: clamp(13px, 2.5vw, 18px); }
    .bar { padding: 1rem 0 1.5rem; }
  }
</style>
</head>
